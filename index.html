<style>
  :root {
    --bg: #0f1117;
    --surface: #181c26;
    --surface2: #1e2333;
    --border: #2a3050;
    --accent: #3b82f6;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ETAPA 1: sem overflow-x: hidden em nenhum ancestral */
  html { width: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
    width: 100%;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
  }
  header h1 { font-size: 15px; font-weight: 700; line-height: 1.3; }
  header h1 span { color: var(--accent); }
  header p { font-size: 11px; color: var(--text3); margin-top: 4px; line-height: 1.5; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 13px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    text-align: center;
    white-space: nowrap;
    user-select: none;
    transition: color .2s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── CONTAINER ── */
  /* ETAPA 1: sem overflow-x: hidden aqui */
  .container { padding: 16px; max-width: 900px; margin: 0 auto; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SUMMARY GRID (ETAPA 3) ── */
  /* Desktop: flex horizontal com scroll */
  .summary-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    margin-bottom: 16px;
    /* ETAPA 2: overflow: clip não bloqueia scroll de filhos */
    /* mas aqui usamos overflow-x: auto mesmo, pois é o próprio container */
  }
  .summary-wrap::-webkit-scrollbar { height: 4px; }
  .summary-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .summary-grid {
    display: flex;
    gap: 8px;
    width: max-content; /* garante que não quebre linha e não corte */
    padding-bottom: 4px;
  }

  /* Mobile: vira grade de colunas fixas, tudo visível sem scroll */
  @media (max-width: 600px) {
    .summary-wrap {
      overflow-x: visible; /* não precisa de scroll: vira grid */
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100%;         /* ocupa largura total */
      gap: 6px;
    }
  }

  .sum-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 10px;
    color: var(--text2);
    white-space: nowrap;
    text-align: center;
    min-width: 0;
  }
  .sum-pill strong {
    color: var(--text);
    font-size: 17px;
    display: block;
    font-weight: 700;
    line-height: 1.2;
  }

  /* No mobile os pills do grid podem quebrar a data em duas linhas */
  @media (max-width: 600px) {
    .sum-pill {
      white-space: normal;
      word-break: break-word;
      font-size: 9px;
      padding: 7px 6px;
    }
    .sum-pill strong { font-size: 15px; }
  }

  /* ── GROUP HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .section-header:hover { background: var(--surface2); }
  .section-header:active { background: var(--surface2); }

  .date-badge {
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .count-badge {
    font-size: 11px;
    color: var(--text3);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .toggle { margin-left: auto; color: var(--text3); font-size: 18px; line-height: 1; flex-shrink: 0; }

  /* ── GROUP WRAP ── */
  .group-wrap { margin-bottom: 12px; }
  .group-table {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
  }
  .group-table.collapsed { display: none; }

  /* ── TABELA DESKTOP ── */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    background: var(--surface2);
    color: var(--text3);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 9px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  td { padding: 9px 14px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .num { color: var(--text3); font-size: 11px; width: 30px; }
  .razao { color: var(--text); font-weight: 500; }
  .cnpj { color: var(--text3); font-size: 11px; font-family: monospace; white-space: nowrap; }
  .badge-date {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    white-space: nowrap;
  }

  /* ── CARDS MOBILE ── */
  @media (max-width: 600px) {
    header h1 { font-size: 14px; }
    .container { padding: 12px; }

    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }

    tr {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
    }
    tr:last-child { border-bottom: none; }
    tr:hover { background: var(--surface); }

    td.num { display: none; }
    td { padding: 2px 0; border: none; font-size: 13px; }
    td.razao {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 5px;
    }
    td.cnpj { font-size: 11px; color: var(--text3); padding-top: 4px; }
    td:last-child { padding-top: 6px; }
    td:last-child::before {
      content: attr(data-label);
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text3);
      margin-bottom: 3px;
    }

    .date-badge { font-size: 11px; padding: 4px 10px; }
    .count-badge { font-size: 10px; padding: 3px 8px; }
    .section-header { padding: 11px 12px; gap: 8px; }
  }

  /* ── CORES DOS GRUPOS ── */
  .c0  { border-left: 3px solid #3b82f6; }
  .c1  { border-left: 3px solid #8b5cf6; }
  .c2  { border-left: 3px solid #06b6d4; }

  footer {

    padding: 20px 16px;
    font-size: 11px;
    color: var(--text3);
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
</style>

const colors  = ['c0','c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11','c12'];
const dbColors = ['db0','db1','db2','db3','db4','db5','db6','db7','db8','db9','db10','db11','db12'];

function parseDate(s) {
  const [d, m, y] = s.split('/');
  return new Date(+y, +m - 1, +d);
}

function groupBy(field) {
  const map = {};
  empresas.forEach(e => {
    const key = e[field];
    if (!map[key]) map[key] = [];
    map[key].push(e);
  });
  return Object.entries(map).sort((a, b) => parseDate(a[0]) - parseDate(b[0]));
}

function renderGroup(containerId, summaryId, field) {
  const groups     = groupBy(field);
  const container  = document.getElementById(containerId);
  const summaryEl  = document.getElementById(summaryId);
  container.innerHTML = '';
  summaryEl.innerHTML = '';

  // Pills do resumo
  groups.forEach(([date, list]) => {
    const pill = document.createElement('div');
    pill.className = 'sum-pill';
    pill.innerHTML = `<strong>${list.length}</strong>${date}`;
    summaryEl.appendChild(pill);
  });

  const otherLabel = field === 3 ? 'Data Abordagem' : 'Data Entrega';
  const otherField = field === 3 ? 2 : 3;

  groups.forEach(([date, list], i) => {
    const ci = i % colors.length;
    const wrap = document.createElement('div');
    wrap.className = 'group-wrap';

    const hdr = document.createElement('div');
    hdr.className = `section-header ${dbColors[ci]} ${colors[ci]}`;
    hdr.innerHTML = `
      <span class="date-badge">${date}</span>
      <span class="count-badge">${list.length} empresa${list.length > 1 ? 's' : ''}</span>
      <span class="toggle">▾</span>`;

    const tableWrap = document.createElement('div');
    tableWrap.className = 'group-table';

    let rows = '';
    list.forEach((e, j) => {
      rows += `<tr>
        <td class="num">${j + 1}</td>
        <td class="cnpj">${e[0]}</td>
        <td class="razao">${e[1]}</td>
        <td data-label="${otherLabel}"><span class="badge-date">${e[otherField]}</span></td>
      </tr>`;
    });

    tableWrap.innerHTML = `<table>
      <thead><tr>
        <th>#</th><th>CNPJ</th><th>Razão Social</th><th>${otherLabel}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

    hdr.addEventListener('click', () => {
      const col = tableWrap.classList.toggle('collapsed');
      hdr.querySelector('.toggle').textContent = col ? '▸' : '▾';
    });

    wrap.appendChild(hdr);
    wrap.appendChild(tableWrap);
    container.appendChild(wrap);
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById(`panel-${name}`).classList.add('active');
}

renderGroup('grupos-entrega',   'summary-entrega',   3);
renderGroup('grupos-abordagem', 'summary-abordagem', 2);
